# ════════════════════════════════════════════════════════════════════════
#  USAGE
#    java -cp target/java-code-chunker-1.0-SNAPSHOT.jar \
#         com.smolnij.chunker.apply.ReindexInspectMain config/reindex-inspect.properties
# ════════════════════════════════════════════════════════════════════════
#
#  ReindexInspectMain configuration
#
#  Read-only Cypher diagnostic for the post-apply re-index repair pass.
#  Pick a check, fill in the relevant before / after / of fields, and run.
# ════════════════════════════════════════════════════════════════════════

# Which check to run. One of:
#   summary        — print Method / Class / Field / CALLS counts.
#   method-rename  — confirm `before` chunkId is gone and callers point at `after`.
#   class-rename   — confirm class FQN was renamed and references re-pointed.
#   field-rename   — confirm field FQN was renamed and READS/WRITES re-pointed.
#   callers        — print the callers (chunkId, file, sample) of `of`.
reindex.check=summary

# For *-rename checks: the pre-rename identifier (chunkId for methods,
# fully-qualified type name for classes / fields).
reindex.before=

# For *-rename checks: the post-rename identifier.
reindex.after=

# For check=callers: the chunkId whose callers should be printed.
reindex.of=

# ──────────────────────────────────────────────────────────────────────
# Neo4j connection (REQUIRED)
# ──────────────────────────────────────────────────────────────────────

neo4j.uri=bolt://localhost:7687
neo4j.user=neo4j
# CHANGE ME for any non-local deployment.
neo4j.password=12345678
