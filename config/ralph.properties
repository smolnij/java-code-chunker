# ════════════════════════════════════════════════════════════════════════
#  USAGE
#    java -cp target/java-code-chunker-1.0-SNAPSHOT.jar \
#         com.smolnij.chunker.ralph.RalphMain config/ralph.properties
# ════════════════════════════════════════════════════════════════════════
#
#  RalphMain configuration (Worker/Judge orchestrator)
#
#  A naive worker proposes a refactoring; a strict judge scores it.
#  The worker retries with judge feedback until approval or
#  ralph.maxIterations is reached.
# ════════════════════════════════════════════════════════════════════════

# ──────────────────────────────────────────────────────────────────────
# Run inputs
# ──────────────────────────────────────────────────────────────────────

# Refactoring instruction. REQUIRED. CHANGE ME for each run.
ralph.query=Refactor createUser to async

# Optional: write the result to this file instead of stdout.
ralph.outputFile=

# When true, prints the full verdict history (every judge round).
ralph.debug=false

# ──────────────────────────────────────────────────────────────────────
# Neo4j connection (REQUIRED)
# ──────────────────────────────────────────────────────────────────────

neo4j.uri=bolt://localhost:7687
neo4j.user=neo4j
# CHANGE ME for any non-local deployment.
neo4j.password=12345678

# ──────────────────────────────────────────────────────────────────────
# LLM endpoints
# ──────────────────────────────────────────────────────────────────────

# Both worker and judge call this same endpoint by default.
ralph.chatUrl=http://localhost:1234/v1/chat/completions

# Worker model name. Leave blank to use whatever LM-Studio has loaded.
ralph.workerModel=

# Judge model name. Leave blank or set equal to workerModel to share
# a single model.
ralph.judgeModel=

# Worker sampling — slightly higher temperature for creative solutions.
ralph.workerTemp=0.3

# Judge sampling — low temperature for precise, deterministic evaluation.
ralph.judgeTemp=0.1

# Shared sampling parameters.
ralph.topP=0.9
ralph.maxTokens=4096

# ──────────────────────────────────────────────────────────────────────
# Loop control
# ──────────────────────────────────────────────────────────────────────

# Max worker/judge round-trips before the loop returns the best attempt.
ralph.maxIterations=5

# Number of context chunks supplied to the worker on the first round.
ralph.maxChunks=6

# Stream worker responses via SSE (recommended).
ralph.stream=true

# Verbose logging: print every prompt/response.
ralph.trace=false

# ──────────────────────────────────────────────────────────────────────
# Embeddings + retrieval (used only for the initial context bundle)
# ──────────────────────────────────────────────────────────────────────

embedding.url=http://localhost:1234/v1/embeddings
embedding.model=text-embedding-nomic-embed-text-v1.5-embedding
embedding.dimensions=768
vector.indexName=method_embeddings
vector.searchK=20

retrieval.maxDepth=2
retrieval.topK=10
retrieval.semanticWeight=0.6
retrieval.graphWeight=0.3
retrieval.structuralWeight=0.1
retrieval.sameClassBonus=1.0
retrieval.samePackageBonus=0.5
retrieval.fanInBonus=0.3
retrieval.fanOutBonus=0.2
retrieval.fanInThreshold=3
retrieval.maxPathsReturned=3
retrieval.maxTopologyEdges=200
# Number of seed nodes the BFS graph-expansion starts from. Seed 0 is the
# resolved primary anchor; the rest are the anchor's highest query-similarity
# class siblings plus top vector hits, so a near-miss anchor pick doesn't strand
# the true target far from any seed. 1 = legacy single-anchor behaviour.
retrieval.maxSeeds=3
retrieval.anchorPct=0.15
retrieval.callersPct=0.30
retrieval.calleesPct=0.25
retrieval.typeNeighborsPct=0.20
