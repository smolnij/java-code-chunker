# ════════════════════════════════════════════════════════════════════════
#  USAGE
#    java -cp target/java-code-chunker-1.0-SNAPSHOT.jar \
#         com.smolnij.chunker.refactor.RefactorMain config/refactor.properties
# ════════════════════════════════════════════════════════════════════════
#
#  RefactorMain configuration
#
#  Single-pass graph-aware refactoring loop. Set refactor.agentMode=true to
#  use LangChain4j tool-calling (or just use AgentRefactorMain instead).
# ════════════════════════════════════════════════════════════════════════

# ──────────────────────────────────────────────────────────────────────
# Run inputs
# ──────────────────────────────────────────────────────────────────────

# Refactoring instruction. REQUIRED. CHANGE ME for each run.
refactor.query=Refactor createUser to async

# Optional: write the refactoring result to this file instead of stdout.
refactor.outputFile=

# When true, prints raw LLM responses after the formatted result.
refactor.debug=false

# ──────────────────────────────────────────────────────────────────────
# Neo4j connection (REQUIRED)
# ──────────────────────────────────────────────────────────────────────

neo4j.uri=bolt://localhost:7687
neo4j.user=neo4j
# CHANGE ME for any non-local deployment.
neo4j.password=12345678

# ──────────────────────────────────────────────────────────────────────
# LLM endpoint (LM-Studio or any OpenAI-compatible /v1/chat/completions)
# ──────────────────────────────────────────────────────────────────────

llm.chatUrl=http://localhost:1234/v1/chat/completions

# Model name. Leave blank to use whatever model is currently loaded
# in LM-Studio.
llm.chatModel=

# Sampling temperature. Lower = more deterministic.
llm.temperature=0.1
# Nucleus sampling cutoff.
llm.topP=0.9
# Cap on response tokens.
llm.maxTokens=66000

# How the chat endpoint should constrain its reply:
#   OFF         — free-form text + regex parsers (legacy)
#   JSON_SCHEMA — server enforces a JSON Schema (recommended)
#   JSON_OBJECT — server forces JSON but no schema
#   TOOL_CALL   — wrap response as a tool-call payload
llm.structuredOutput=JSON_SCHEMA

# ──────────────────────────────────────────────────────────────────────
# Refactor loop control
# ──────────────────────────────────────────────────────────────────────

# Number of context chunks supplied to the LLM. 4–8 works well for local
# models; larger values risk exceeding the context window.
refactor.maxChunks=6

# How many expand-and-retry rounds the loop will attempt before giving up.
refactor.maxRefinements=2

# When true, streams responses from LM-Studio via SSE (recommended).
refactor.stream=true

# Log every prompt + completion (verbose). Useful for debugging.
refactor.trace=true

# ──────────────────────────────────────────────────────────────────────
# Agent mode (LangChain4j) — leave false for the classic pipeline
# ──────────────────────────────────────────────────────────────────────

# When true, RefactorMain runs in agentic mode: the LLM autonomously
# calls retrieval tools instead of being fed a fixed bundle. Set to false
# unless you specifically want this; AgentRefactorMain forces it to true
# regardless of this value.
refactor.agentMode=false

# Hard cap on tool invocations per agent conversation.
refactor.maxToolCalls=20

# Chat memory window (messages) for the agent.
refactor.chatMemorySize=40

# ──────────────────────────────────────────────────────────────────────
# Apply (deterministic file edits after a SAFE verdict)
# ──────────────────────────────────────────────────────────────────────

# When set, the post-apply Neo4j re-indexer rewires :Method.code +
# outbound edges for the edited files. Leave blank to disable apply.
refactor.repoRoot=

# Master switch — false means the loop only proposes changes (no writes).
refactor.apply=false

# When true (and apply=true), prints the patch but does not touch disk.
refactor.dryRun=true

# Whether to keep .bak copies of files before overwriting them.
refactor.backup=true

# ──────────────────────────────────────────────────────────────────────
# Compile verification gate (only consulted when apply=true)
# ──────────────────────────────────────────────────────────────────────

# When true, blocks apply if the post-edit compile check fails.
apply.requireCompile=true

# Verifier mode: fast | full | auto. `auto` picks fast for small diffs.
verify.mode=auto

# Cap on the number of compile errors reported.
verify.maxErrors=25

# Directory used to cache resolved Maven classpaths between verifier
# invocations. Empty → <repoRoot>/target.
verify.classpathCacheDir=

# ──────────────────────────────────────────────────────────────────────
# Embeddings + retrieval (these mirror RetrievalConfig)
# ──────────────────────────────────────────────────────────────────────

embedding.url=http://localhost:1234/v1/embeddings
embedding.model=text-embedding-nomic-embed-text-v1.5-embedding
embedding.dimensions=768
vector.indexName=method_embeddings
vector.searchK=20

retrieval.maxDepth=2
retrieval.topK=10
retrieval.semanticWeight=0.6
retrieval.graphWeight=0.3
retrieval.structuralWeight=0.1
retrieval.sameClassBonus=1.0
retrieval.samePackageBonus=0.5
retrieval.fanInBonus=0.3
retrieval.fanOutBonus=0.2
retrieval.fanInThreshold=3
retrieval.maxPathsReturned=3
retrieval.maxTopologyEdges=200
# Number of seed nodes the BFS graph-expansion starts from. Seed 0 is the
# resolved primary anchor; the rest are the anchor's highest query-similarity
# class siblings plus top vector hits, so a near-miss anchor pick doesn't strand
# the true target far from any seed. 1 = legacy single-anchor behaviour.
retrieval.maxSeeds=3
retrieval.anchorPct=0.15
retrieval.callersPct=0.30
retrieval.calleesPct=0.25
retrieval.typeNeighborsPct=0.20
