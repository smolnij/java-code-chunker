# ════════════════════════════════════════════════════════════════════════
#  USAGE
#    java -cp target/java-code-chunker-1.0-SNAPSHOT.jar com.smolnij.chunker.eval.EvalMain config/eval.properties
# ════════════════════════════════════════════════════════════════════════
#
#  EvalMain configuration
#
#  Golden-task evaluation harness. Loads fixtures, runs each through
#  retrieval or safeloop, scores against gold, writes a manifest +
#  human/machine reports + an optional baseline diff.
# ════════════════════════════════════════════════════════════════════════

# ──────────────────────────────────────────────────────────────────────
# Fixture selection
# ──────────────────────────────────────────────────────────────────────

# Directory containing the fixture .json files. Leave blank to use
# "eval-fixtures" relative to the JVM working dir.
eval.fixturesDir=eval-fixtures

# Optional regex filter on fixture id.
eval.idRegex=

# Comma-separated tags. A fixture must have ALL listed tags to be picked.
eval.tags=

# Force every fixture to a single mode: retrieval | safeloop. Leave blank
# to honor each fixture's own `mode` field.
eval.mode=

# Force fixtures to mode=retrieval at runtime (useful when iterating on
# retrieval changes without firing the LLM loop).
eval.retrievalOnly=false

# First-N fixtures after filtering. 0 = no limit.
eval.limit=0

# ──────────────────────────────────────────────────────────────────────
# Run mode
# ──────────────────────────────────────────────────────────────────────

# Skip Neo4j + LLM and synthesise RunResults from the gold set.
eval.dryRun=false

# `true` implies dryRun=true and asserts every metric is PASS or NOT_RUN.
eval.selfCheck=false

# Stop on the first fixture that errors instead of continuing.
eval.failFast=false

# Verbose per-fixture logging.
eval.debug=true

# Compile-step verifier. `noop` returns NOT_RUN; `compiling` invokes the
# real javac-driven verifier (slower, requires a buildable target repo).
#
# With the default `noop`, every fixture's `compile.pass` and `tests.pass`
# rows print as [NOT_RUN] with note "no verifier wired (N-1 pending)" — this
# is BY DESIGN. The summary banner "By metric (NOT_RUN excluded from rates)"
# in SummaryReporter means those NOT_RUN rows are not counted against the
# overall pass rate.
#
# Set this to `compiling` to actually evaluate `compile.pass` (PASS/FAIL).
# `tests.pass` will continue to emit NOT_RUN until CompilingVerifier#verifyTests
# is wired up — that's a separate piece of work tracked in the codebase.
eval.verifier=noop

# ──────────────────────────────────────────────────────────────────────
# Output / regression diff
# ──────────────────────────────────────────────────────────────────────

# Output directory. Leave blank to default to eval-results/<UTC-timestamp>/.
eval.outputDir=

# Optional path to a previous run's runs.jsonl. When set, a regression
# diff is written and the exit code goes nonzero on regressions.
eval.baseline=

# Tolerance applied per-metric when computing regressions.
eval.diffEpsilon=0.05

# ──────────────────────────────────────────────────────────────────────
# Neo4j connection (REQUIRED unless eval.dryRun=true)
# ──────────────────────────────────────────────────────────────────────

neo4j.uri=bolt://localhost:7687
neo4j.user=neo4j
# CHANGE ME for any non-local deployment.
neo4j.password=12345678

# ──────────────────────────────────────────────────────────────────────
# Embeddings + retrieval (used by RetrievalConfig for live runs)
# ──────────────────────────────────────────────────────────────────────

embedding.url=http://localhost:1234/v1/embeddings
#embedding.model=text-embedding-nomic-embed-text-v1.5
embedding.model=text-embedding-nomic-embed-text-v1.5-embedding
embedding.dimensions=768
vector.indexName=method_embeddings
vector.searchK=20

retrieval.maxDepth=2
retrieval.topK=10
retrieval.semanticWeight=0.6
retrieval.graphWeight=0.3
retrieval.structuralWeight=0.1
retrieval.sameClassBonus=1.0
retrieval.samePackageBonus=0.5
retrieval.fanInBonus=0.3
retrieval.fanOutBonus=0.2
retrieval.fanInThreshold=3
retrieval.maxPathsReturned=3
retrieval.maxTopologyEdges=200
# Number of seed nodes the BFS graph-expansion starts from. Seed 0 is the
# resolved primary anchor; the rest are the anchor's highest query-similarity
# class siblings plus top vector hits, so a near-miss anchor pick doesn't strand
# the true target far from any seed. 1 = legacy single-anchor behaviour.
retrieval.maxSeeds=3
retrieval.anchorPct=0.15
retrieval.callersPct=0.30
retrieval.calleesPct=0.25
retrieval.typeNeighborsPct=0.20

# ──────────────────────────────────────────────────────────────────────
# SafeLoop knobs (used when eval runs a fixture in safeloop mode)
# ──────────────────────────────────────────────────────────────────────

safeloop.chatUrl=http://localhost:1234/v1/chat/completions
# Must name a CHAT model loaded in LM-Studio. Leaving these blank makes the
# refactor agent send the placeholder "local-model", which LM-Studio resolves
# to the first model on disk — an *embedding* model here — and chat fails with
# "Failed to resolve model metadata for ...".
safeloop.refactorModel=qwen/qwen3-coder-30b
safeloop.analyzerModel=qwen/qwen3-coder-30b
safeloop.refactorTemp=0.3
safeloop.analyzerTemp=0.1
safeloop.selfReviewTemp=0.05
safeloop.topP=0.9
safeloop.maxTokens=66000
safeloop.safetyThreshold=0.9
safeloop.maxIterations=5
safeloop.maxChunks=8
safeloop.chatMemorySize=60
safeloop.maxToolCalls=30
safeloop.minCallerDepth=1
safeloop.minCalleeDepth=1
safeloop.stopOnNoNewNodes=true
safeloop.stopOnStagnation=true
safeloop.stream=true
safeloop.trace=false
safeloop.repoRoot=/home/smola/dev/src/AI_tools/java-code-chunker
safeloop.apply=false
safeloop.dryRun=true
safeloop.backup=true
safeloop.reindex.cascadeEnabled=true
safeloop.reindex.cascadeMaxFiles=25

llm.structuredOutput=JSON_SCHEMA
apply.requireCompile=true
verify.mode=auto
verify.maxErrors=25
verify.classpathCacheDir=
