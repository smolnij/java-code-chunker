# ════════════════════════════════════════════════════════════════════════
#  USAGE
#    java -jar target/java-code-chunker-1.0-SNAPSHOT.jar config/chunker.properties
# ════════════════════════════════════════════════════════════════════════
#
#  ChunkerMain configuration
#
#  Parses a Java repository into method-level chunks + a call graph and
#  writes chunks.json, graph.json, chunks_readable.txt to chunker.outputDir.
#  Optionally persists the graph to Neo4j when neo4j.uri + neo4j.password
#  are set, and embeds chunks if embedding.url is set.
# ════════════════════════════════════════════════════════════════════════

# ──────────────────────────────────────────────────────────────────────
# Chunker inputs
# ──────────────────────────────────────────────────────────────────────

# Absolute path to the Java repository to chunk.
# CHANGE ME — this must point at the source tree you want indexed.
chunker.repoRoot=/home/smola/dev/src/AI_tools/java-code-chunker

# Directory where chunks.json / graph.json / chunks_readable.txt are written.
# Resolved relative to the JVM working directory if not absolute.
chunker.outputDir=chunker-output

# Maximum cl100k_base tokens per chunk before line-aware splitting kicks in.
# 256–1024 is reasonable; smaller values produce more, finer-grained chunks
# at the cost of losing local context.
chunker.maxTokens=512

# Comma-separated list of source roots to scan, relative to chunker.repoRoot.
# Add module-specific roots for multi-module Maven projects.
chunker.sourceRoots=src/main/java,src/test/java

# Optional comma-separated dependency jars (or directories containing jars)
# added to the symbol-solver type path. Without them, calls into third-party
# libraries cannot be resolved to fully-qualified targets and become
# non-navigable "dead-end" edges (watch the "Call resolution: N% resolved"
# line in the run output). Point this at your Maven/Gradle dependency dir, e.g.
#   chunker.classpath=/home/me/.m2/repository,/path/to/libs
# Leave blank to skip (JDK types still resolve via reflection).
chunker.classpath=

# ──────────────────────────────────────────────────────────────────────
# Neo4j persistence (optional — leave neo4j.uri blank to skip)
# ──────────────────────────────────────────────────────────────────────

# Bolt URI of the target Neo4j instance. Leave blank to skip Neo4j export.
neo4j.uri=bolt://localhost:7687

# Neo4j username.
neo4j.user=neo4j

# Neo4j password. CHANGE ME for any non-local deployment.
neo4j.password=12345678

# When true, wipes the entire database before importing. Set to false to
# preserve existing nodes (delta re-index instead of full rebuild).
neo4j.clean=true

# ──────────────────────────────────────────────────────────────────────
# Embeddings (optional — leave embedding.url blank to skip vector index)
# ──────────────────────────────────────────────────────────────────────

# Embedding service endpoint (OpenAI-compatible /v1/embeddings).
# Leave blank to skip embedding generation and the vector index init.
embedding.url=http://localhost:1234/v1/embeddings

# Embedding model name as known to the LM-Studio / OpenAI-compatible server.
#embedding.model=text-embedding-nomic-embed-text-v1.5
embedding.model=text-embedding-nomic-embed-text-v1.5-embedding

# Embedding vector length. Must match the model. Used to size the Neo4j
# vector index — changing it requires dropping and recreating the index.
embedding.dimensions=768

# Name of the Neo4j vector index created over :Method(embedding).
vector.indexName=method_embeddings
