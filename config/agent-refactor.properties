# ════════════════════════════════════════════════════════════════════════
#  AgentRefactorMain configuration
# ════════════════════════════════════════════════════════════════════════
#  Run:  java -cp target/java-code-chunker-1.0-SNAPSHOT.jar \
#             com.smolnij.chunker.refactor.AgentRefactorMain config/agent-refactor.properties
#
#  LangChain4j agentic refactoring. The LLM decides when to call retrieval
#  tools. AgentRefactorMain forces refactor.agentMode=true regardless of
#  what this file says. Requires a tool-calling capable model
#  (Qwen 2.5 / Mistral / Llama 3.1+).
# ════════════════════════════════════════════════════════════════════════

# ──────────────────────────────────────────────────────────────────────
# Run inputs
# ──────────────────────────────────────────────────────────────────────

# Refactoring instruction. REQUIRED. CHANGE ME for each run.
refactor.query=Refactor createUser to async

# Optional: write the result to this file instead of stdout.
refactor.outputFile=

# When true, prints the raw agent response after the formatted output.
refactor.debug=false

# ──────────────────────────────────────────────────────────────────────
# Neo4j connection (REQUIRED)
# ──────────────────────────────────────────────────────────────────────

neo4j.uri=bolt://localhost:7687
neo4j.user=neo4j
# CHANGE ME for any non-local deployment.
neo4j.password=12345678

# ──────────────────────────────────────────────────────────────────────
# LLM endpoint
# ──────────────────────────────────────────────────────────────────────

llm.chatUrl=http://localhost:1234/v1/chat/completions
# Model name; must support function/tool calling. Leave blank to use
# whatever LM-Studio currently has loaded.
llm.chatModel=
llm.temperature=0.1
llm.topP=0.9
llm.maxTokens=66000
llm.structuredOutput=JSON_SCHEMA

# ──────────────────────────────────────────────────────────────────────
# Refactor knobs (agent mode is forced on regardless of this value)
# ──────────────────────────────────────────────────────────────────────

refactor.maxChunks=6
refactor.stream=true
refactor.trace=true
refactor.maxToolCalls=20
refactor.chatMemorySize=40
refactor.maxRefinements=2

# Ignored by AgentRefactorMain — kept for symmetry with refactor.properties.
refactor.agentMode=true

# Apply / verify (rarely used in pure-agentic mode).
refactor.repoRoot=
refactor.apply=false
refactor.dryRun=true
refactor.backup=true
apply.requireCompile=true
verify.mode=auto
verify.maxErrors=25
verify.classpathCacheDir=

# ──────────────────────────────────────────────────────────────────────
# Embeddings + retrieval
# ──────────────────────────────────────────────────────────────────────

embedding.url=http://localhost:1234/v1/embeddings
embedding.model=text-embedding-nomic-embed-text-v1.5
embedding.dimensions=768
vector.indexName=method_embeddings
vector.searchK=20

retrieval.maxDepth=2
retrieval.topK=10
retrieval.semanticWeight=0.6
retrieval.graphWeight=0.3
retrieval.structuralWeight=0.1
retrieval.sameClassBonus=1.0
retrieval.samePackageBonus=0.5
retrieval.fanInBonus=0.3
retrieval.fanOutBonus=0.2
retrieval.fanInThreshold=3
retrieval.maxPathsReturned=3
retrieval.maxTopologyEdges=200
retrieval.anchorPct=0.15
retrieval.callersPct=0.30
retrieval.calleesPct=0.25
retrieval.typeNeighborsPct=0.20
