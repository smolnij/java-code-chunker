# ════════════════════════════════════════════════════════════════════════
#  USAGE
#    java -cp target/java-code-chunker-1.0-SNAPSHOT.jar \
#         com.smolnij.chunker.safeloop.distributed.DistributedSafeLoopMain \
#         config/safeloop-distributed.properties
# ════════════════════════════════════════════════════════════════════════
#
#  DistributedSafeLoopMain configuration
#
#  Two LLM machines:
#    * Generator (REFACTOR_MACHINE)        — writes code, no tool calling.
#    * Planner-Analyzer (S_ANALYZE_MACHINE) — controls everything,
#      autonomously calls retrieval and refactor tools.
#
#  The Planner-Analyzer model MUST support function/tool calling.
# ════════════════════════════════════════════════════════════════════════

# ──────────────────────────────────────────────────────────────────────
# Run inputs
# ──────────────────────────────────────────────────────────────────────

# Refactoring instruction. REQUIRED. CHANGE ME for each run.
dist.query=Refactor createUser to async

# Optional: write the result to this file instead of stdout.
dist.outputFile=

# Optional: write the full JSON protocol log to this file.
dist.jsonLog=

# When true, prints the full verdict history.
dist.debug=false

# ──────────────────────────────────────────────────────────────────────
# Neo4j connection (REQUIRED)
# ──────────────────────────────────────────────────────────────────────

neo4j.uri=bolt://localhost:7687
neo4j.user=neo4j
# CHANGE ME for any non-local deployment.
neo4j.password=12345678

# ──────────────────────────────────────────────────────────────────────
# Machine 1: Generator (REFACTOR_MACHINE)
# ──────────────────────────────────────────────────────────────────────

# CHANGE ME — point at the REFACTOR machine running LM-Studio.
dist.refactorUrl=http://REFACTORM:1234/v1/chat/completions

# Generator model name. Leave blank to use whatever is loaded there.
dist.refactorModel=

# Generator sampling — slightly higher temperature for creative code.
dist.refactorTemp=0.3

# ──────────────────────────────────────────────────────────────────────
# Machine 2: Planner-Analyzer (S_ANALYZE_MACHINE) — must support tools
# ──────────────────────────────────────────────────────────────────────

# CHANGE ME — point at the S_ANALYZE machine running LM-Studio.
dist.analyzerUrl=http://SANALYZEM:1234/v1/chat/completions

# Planner-Analyzer model name. Leave blank to use whatever is loaded there.
dist.analyzerModel=

# Planner-Analyzer sampling — precise, deterministic.
dist.analyzerTemp=0.1

# ──────────────────────────────────────────────────────────────────────
# Shared sampling / loop control
# ──────────────────────────────────────────────────────────────────────

dist.topP=0.9
dist.maxTokens=66000

# Confidence threshold the Planner-Analyzer must hit to declare SAFE.
dist.safetyThreshold=0.9

# Hard cap on full safety-loop iterations.
dist.maxIterations=5

# ──────────────────────────────────────────────────────────────────────
# Context windows
# ──────────────────────────────────────────────────────────────────────

# Default chunk count returned per retrieval call.
dist.maxChunks=8

# Sliding chat-memory window (messages) for the Planner-Analyzer.
dist.chatMemorySize=60

# Soft cap on tool invocations per agent run.
dist.maxToolCalls=30

# ──────────────────────────────────────────────────────────────────────
# Graph coverage
# ──────────────────────────────────────────────────────────────────────

dist.minCallerDepth=1
dist.minCalleeDepth=1

# ──────────────────────────────────────────────────────────────────────
# Planner-driven mode tuning
# ──────────────────────────────────────────────────────────────────────

# Max planner-tool-call steps inside a single LangChain4j run.
dist.maxPlannerSteps=8

# Max chunks returned per Planner retrieval call.
dist.maxChunksPerRetrieval=10

# Max graph hops per Planner retrieval call.
dist.maxRetrievalDepth=2

# ──────────────────────────────────────────────────────────────────────
# Convergence
# ──────────────────────────────────────────────────────────────────────

dist.stopOnNoNewNodes=true
dist.stopOnStagnation=true

# Stream Generator responses via SSE (recommended).
dist.stream=true

# Verbose logging.
dist.trace=false

# ──────────────────────────────────────────────────────────────────────
# Embeddings + retrieval (used for the Planner's retrieval tools)
# ──────────────────────────────────────────────────────────────────────

embedding.url=http://localhost:1234/v1/embeddings
#embedding.model=text-embedding-nomic-embed-text-v1.5-embedding
embedding.model=text-embedding-nomic-embed-text-v1.5-embedding
embedding.dimensions=768
vector.indexName=method_embeddings
vector.searchK=20

retrieval.maxDepth=2
retrieval.topK=10
retrieval.semanticWeight=0.6
retrieval.graphWeight=0.3
retrieval.structuralWeight=0.1
retrieval.sameClassBonus=1.0
retrieval.samePackageBonus=0.5
retrieval.fanInBonus=0.3
retrieval.fanOutBonus=0.2
retrieval.fanInThreshold=3
retrieval.maxPathsReturned=3
retrieval.maxTopologyEdges=200
# Number of seed nodes the BFS graph-expansion starts from. Seed 0 is the
# resolved primary anchor; the rest are the anchor's highest query-similarity
# class siblings plus top vector hits, so a near-miss anchor pick doesn't strand
# the true target far from any seed. 1 = legacy single-anchor behaviour.
retrieval.maxSeeds=3
retrieval.anchorPct=0.15
retrieval.callersPct=0.30
retrieval.calleesPct=0.25
retrieval.typeNeighborsPct=0.20
