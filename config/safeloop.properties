# ════════════════════════════════════════════════════════════════════════
#  USAGE
#    java -cp target/java-code-chunker-1.0-SNAPSHOT.jar \
#         com.smolnij.chunker.safeloop.SafeLoopMain config/safeloop.properties
# ════════════════════════════════════════════════════════════════════════
#
#  SafeLoopMain configuration
#
#  Self-improving safe refactoring loop:
#    1. Refactorer proposes change (autonomous tool calls).
#    2. Analyzer scores it for safety.
#    3. If unsafe, expand graph context and retry.
#    4. Stop when safetyThreshold is met or convergence is detected.
# ════════════════════════════════════════════════════════════════════════

# ──────────────────────────────────────────────────────────────────────
# Run inputs
# ──────────────────────────────────────────────────────────────────────

# Refactoring instruction. REQUIRED. CHANGE ME for each run.
safeloop.query=Suggest refactoring of RalphLoop to take prompt and other settings from file instead of from \
  CLI. Apply your refactoring suggestions via tools directly to target files";

# Optional: write the result to this file instead of stdout.
safeloop.outputFile=/home/smola/llmout6_with_AST_lang4j13

# When true, prints the full safety verdict history (every analyzer round).
safeloop.debug=false

# ──────────────────────────────────────────────────────────────────────
# Neo4j connection (REQUIRED)
# ──────────────────────────────────────────────────────────────────────

neo4j.uri=bolt://localhost:7687
neo4j.user=neo4j
# CHANGE ME for any non-local deployment.
neo4j.password=12345678

# ──────────────────────────────────────────────────────────────────────
# LLM endpoints (refactorer + analyzer share this URL by default)
# ──────────────────────────────────────────────────────────────────────

safeloop.chatUrl=http://localhost:1234/v1/chat/completions

# Refactorer model. Must support tool calling. Leave blank for LM-Studio default.
safeloop.refactorModel=

# Analyzer model. Leave blank to reuse the refactorer model.
safeloop.analyzerModel=

# Refactorer sampling — creative.
safeloop.refactorTemp=0.3
# Analyzer sampling — precise.
safeloop.analyzerTemp=0.1
# Self-review pass — even more deterministic than the analyzer.
safeloop.selfReviewTemp=0.05

# Shared sampling.
safeloop.topP=0.9
safeloop.maxTokens=66000

# ──────────────────────────────────────────────────────────────────────
# Safety loop control
# ──────────────────────────────────────────────────────────────────────

# Confidence threshold required for the analyzer to declare SAFE.
# Lower while iterating on prompts; bump to 0.9+ for production runs.
safeloop.safetyThreshold=0.9

# Hard cap on refactor + analyze round-trips.
safeloop.maxIterations=5

# Number of code chunks returned per retrieval tool call.
safeloop.maxChunks=8

# Sliding window size for the agent's chat memory (number of messages).
safeloop.chatMemorySize=60

# Soft cap on tool invocations per agent run (logged only; the hard cap
# inside LangChain4j is RefactorAgent.MAX_SEQUENTIAL_TOOLS_EXECUTIONS=200).
safeloop.maxToolCalls=30

# Force the refactorer to inspect at least this many hops of callers /
# callees before proposing a change.
safeloop.minCallerDepth=1
safeloop.minCalleeDepth=1

# Convergence: stop when graph expansion yields no new nodes.
safeloop.stopOnNoNewNodes=true
# Convergence: stop when the analyzer reports the same risks twice.
safeloop.stopOnStagnation=true

# Stream refactorer responses via SSE (recommended).
safeloop.stream=true

# Verbose logging: print every prompt/response.
safeloop.trace=true

# How the chat endpoint should constrain its reply (see refactor.properties).
llm.structuredOutput=JSON_SCHEMA

# ──────────────────────────────────────────────────────────────────────
# Apply (deterministic file edits after the SAFE verdict)
# ──────────────────────────────────────────────────────────────────────

# When set, the post-apply Neo4j re-indexer keeps the graph in sync after
# writes. Leave blank to disable apply entirely.
# CHANGE ME — typically the same path as chunker.repoRoot.
safeloop.repoRoot=/home/smola/dev/src/AI_tools/java-code-chunker

# Master switch — false means propose changes only.
safeloop.apply=true

# When true (and apply=true), prints the patch but does not write to disk.
safeloop.dryRun=false

# Whether to keep .bak copies of files before overwriting them.
safeloop.backup=true

# ──────────────────────────────────────────────────────────────────────
# Compile verification (consulted on commitPlan / apply)
# ──────────────────────────────────────────────────────────────────────

# Block apply if the post-edit compile check fails.
apply.requireCompile=true
# fast | full | auto.
verify.mode=auto
verify.maxErrors=25
verify.classpathCacheDir=

# ──────────────────────────────────────────────────────────────────────
# Post-apply Neo4j re-index cascade
# ──────────────────────────────────────────────────────────────────────

# When true, re-parses unchanged caller files so :Method.code stays in sync
# after a cross-file rename / signature change.
safeloop.reindex.cascadeEnabled=true

# Cap on the cascade pass. Files beyond the cap fall back to surgical
# edge rewrite + a stale-source-text WARN log.
safeloop.reindex.cascadeMaxFiles=25

# ──────────────────────────────────────────────────────────────────────
# Embeddings + retrieval
# ──────────────────────────────────────────────────────────────────────

embedding.url=http://localhost:1234/v1/embeddings
embedding.model=text-embedding-nomic-embed-text-v1.5
embedding.dimensions=768
vector.indexName=method_embeddings
vector.searchK=20

retrieval.maxDepth=2
retrieval.topK=10
retrieval.semanticWeight=0.6
retrieval.graphWeight=0.3
retrieval.structuralWeight=0.1
retrieval.sameClassBonus=1.0
retrieval.samePackageBonus=0.5
retrieval.fanInBonus=0.3
retrieval.fanOutBonus=0.2
retrieval.fanInThreshold=3
retrieval.maxPathsReturned=3
retrieval.maxTopologyEdges=200
retrieval.anchorPct=0.15
retrieval.callersPct=0.30
retrieval.calleesPct=0.25
retrieval.typeNeighborsPct=0.20
