# ════════════════════════════════════════════════════════════════════════
#  USAGE
#    java -cp target/java-code-chunker-1.0-SNAPSHOT.jar \
#         com.smolnij.chunker.retrieval.RetrievalMain config/retrieval.properties
# ════════════════════════════════════════════════════════════════════════
#
#  RetrievalMain configuration
#
#  Runs the 5-step hybrid Graph-RAG retrieval over the code graph already
#  loaded in Neo4j (run ChunkerMain first). Prints LLM-ready context to
#  stdout, or to retrieval.outputFile if set.
# ════════════════════════════════════════════════════════════════════════

# ──────────────────────────────────────────────────────────────────────
# Run inputs
# ──────────────────────────────────────────────────────────────────────

# The natural-language refactoring/exploration question. REQUIRED.
# CHANGE ME for each run.
retrieval.query=Refactor createUser to async

# Optional: write the rendered LLM context to this file instead of stdout.
# Leave blank to print to stdout.
retrieval.outputFile=

# When true, prints the full ranked-result list with scores after the context.
retrieval.debug=false

# ──────────────────────────────────────────────────────────────────────
# Neo4j connection (REQUIRED)
# ──────────────────────────────────────────────────────────────────────

# Bolt URI of the Neo4j instance with the code graph already loaded.
neo4j.uri=bolt://localhost:7687
neo4j.user=neo4j
# CHANGE ME for any non-local deployment.
neo4j.password=12345678

# ──────────────────────────────────────────────────────────────────────
# Graph expansion
# ──────────────────────────────────────────────────────────────────────

# Base BFS depth from the anchor chunk; escalates to maxDepth+1 when the
# anchor has fewer than topK/2 neighbors.
retrieval.maxDepth=2

# Number of result chunks returned to the caller after re-ranking.
retrieval.topK=10

# ──────────────────────────────────────────────────────────────────────
# Scoring weights (must sum to ≈1.0)
#   finalScore = semanticWeight * cosineSimilarity
#              + graphWeight    * (1 / (1 + hopDistance))
#              + structuralWeight * structuralBonus
# ──────────────────────────────────────────────────────────────────────

retrieval.semanticWeight=0.6
retrieval.graphWeight=0.3
retrieval.structuralWeight=0.1

# ──────────────────────────────────────────────────────────────────────
# Structural bonus factors
# ──────────────────────────────────────────────────────────────────────

# Bonus when the candidate is in the same class as the anchor.
retrieval.sameClassBonus=1.0
# Bonus when it is in the same package (but different class).
retrieval.samePackageBonus=0.5
# Multiplier on min(calledBy / fanInThreshold, 1.0).
retrieval.fanInBonus=0.3
# Multiplier on min(calls / fanInThreshold, 1.0).
retrieval.fanOutBonus=0.2
# Threshold above which a method is considered a fan-in/fan-out hub.
retrieval.fanInThreshold=3

# ──────────────────────────────────────────────────────────────────────
# Embedding service
# ──────────────────────────────────────────────────────────────────────

# OpenAI-compatible /v1/embeddings endpoint.
embedding.url=http://localhost:1234/v1/embeddings
embedding.model=text-embedding-nomic-embed-text-v1.5-embedding
# Must match what the embedding model emits and what the Neo4j vector
# index was sized to.
embedding.dimensions=768

# ──────────────────────────────────────────────────────────────────────
# Neo4j vector index
# ──────────────────────────────────────────────────────────────────────

vector.indexName=method_embeddings
# Number of nearest-neighbor candidates pulled from the vector index
# before re-ranking.
vector.searchK=20

# ──────────────────────────────────────────────────────────────────────
# Path / topology rendering
# ──────────────────────────────────────────────────────────────────────

# Max paths returned per anchor chunk (between anchor and a neighbor).
retrieval.maxPathsReturned=3
# Max edges in the topology summary; large graphs are truncated.
retrieval.maxTopologyEdges=200

# ──────────────────────────────────────────────────────────────────────
# Budget allocator (fractions of topK reserved per bucket)
# Anything left after summing these four becomes topology-only fallback.
# ──────────────────────────────────────────────────────────────────────

retrieval.anchorPct=0.15
retrieval.callersPct=0.30
retrieval.calleesPct=0.25
retrieval.typeNeighborsPct=0.20

# ──────────────────────────────────────────────────────────────────────
# Diagnostics
# ──────────────────────────────────────────────────────────────────────

# Verbose resolver / scoring traces. When true, the CONTAINS @class-boundary
# fallback dumps the full ranked candidate table (chunkId, fanIn, fanOut,
# why-rejected) so bad picks like reset() winning by trivial tie-break are
# visible from the log instead of hidden behind "picked highest fan-in=N".
retrieval.trace=true
